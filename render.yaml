services:
  - type: web
    name: toko-marcell-api
    runtime: python
    rootDir: api
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      # Preferred LLM provider. Set the actual key in the Render dashboard
      # (sync: false) so the secret is never committed to the repo.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openrouter/free
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      # Fallback provider, used only when OPENROUTER_API_KEY is empty.
      - key: GEMINI_API_KEY
        sync: false
      # Cross-encoder off on 512 MB.
      - key: ENABLE_RERANKER
        value: "false"
      # Vocabulary-pruned multilingual MiniLM (113k Latin/ID/EN tokens, 124 MB ONNX).
      # With one ONNX thread and enable_cpu_mem_arena=False it runs at ~380 MB RSS,
      # so full hybrid dense + lexical search fits Render's 512 MB free tier without OOM.
      - key: ENABLE_DENSE_SEARCH
        value: "true"
      # 100% numerically equivalent to sentence-transformers/paraphrase-multilingual-
      # MiniLM-L12-v2; only non-Latin vocabulary rows were pruned.
      - key: TEXT_EMBED_MODEL
        value: "Marcell-Kristianto/paraphrase-multilingual-MiniLM-L12-v2-id-en-onnx"
      # Pin ONNX Runtime to a single thread so fastembed does not spawn a
      # per-core thread pool that pushes the 512 MB container into OOM.
      - key: FASTEMBED_THREADS
        value: "1"
      # Admin token for /search/reindex — set a strong secret in the dashboard.
      - key: ADMIN_TOKEN
        sync: false
      # Signs 15-minute admin access JWTs. Set a 32+ byte random secret in the
      # Render dashboard (openssl rand -hex 32); never commit the real value.
      - key: JWT_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: TRUST_PROXY
        value: "true"
