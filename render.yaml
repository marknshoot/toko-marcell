services:
  - type: web
    name: toko-marcell-api
    runtime: python
    rootDir: api
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      # Preferred LLM provider. Set the actual key in the Render dashboard
      # (sync: false) so the secret is never committed to the repo.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openrouter/free
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      # Fallback provider, used only when OPENROUTER_API_KEY is empty.
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_TRIMODAL
        value: "false"
