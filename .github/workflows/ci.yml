name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Production Build
        run: npm run build

  backend:
    name: Backend (Ruff + Full API Tests with Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: toko
          POSTGRES_PASSWORD: toko
          POSTGRES_DB: toko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toko -d toko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check api/ --fix && ruff check api/

      - name: Restore database from seed
        run: |
          gunzip -c data/seed/init.sql.gz | PGPASSWORD=toko psql -h localhost -U toko -d toko -q
        env:
          PGPASSWORD: toko

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ runner.os }}-v1

      - name: Run unit tests (no DB)
        run: |
          python -m pytest api/tests/test_search_unit.py pipelines/tests/test_pipeline_math.py -v

      - name: Run SSRF validation tests
        run: |
          python -m pytest api/tests/test_ssrf_image_validation.py api/tests/test_rate_limiter.py -v

      - name: Run full API test suite
        env:
          DATABASE_URL: postgresql://toko:toko@localhost:5432/toko
          ADMIN_TOKEN: ci-test-admin-token
          FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
          ENABLE_TRIMODAL: "true"
          ENABLE_RERANKER: "false"
          COPILOT_FAKE_LLM: "1"
        run: |
          # Start the API server in the background
          cd api
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          API_PID=$!
          cd ..

          # Wait for the API to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

          # Run integration tests (tests skip cleanly when models are unavailable)
          python -m pytest api/tests/ -v \
            || TEST_EXIT=$?

          # Stop the API server
          kill $API_PID 2>/dev/null || true
          exit ${TEST_EXIT:-0}

  deploy-render:
    name: Render Deploy Status
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger & Poll Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::notice::Set RENDER_API_KEY and RENDER_SERVICE_ID secrets to track Render deployment status."
            exit 0
          fi

          DEPLOY_ID=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Tracking Render deploy: $DEPLOY_ID"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Render deploy status: $STATUS ($i/60)"
            if [ "$STATUS" = "live" ]; then
              echo "Render deploy is live!"
              exit 0
            fi
            case "$STATUS" in
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render deploy $DEPLOY_ID"
          exit 1
