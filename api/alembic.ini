# Alembic config for the Toko Marcell schema.
#
#   cd api
#   alembic upgrade head          # apply all migrations (the API also does this on startup)
#   alembic current               # show the applied revision
#   alembic revision -m "msg"     # new hand-written migration in migrations/versions/
#
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL via
# config.get_settings(), exactly like the API does.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
