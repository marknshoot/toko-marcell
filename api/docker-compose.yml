services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: toko
      POSTGRES_PASSWORD: toko
      POSTGRES_DB: toko
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toko -d toko"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://toko:toko@db:5432/toko
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

  # Offline job, not a server: it seeds the catalog built by pipelines/build_catalog.py.
  # It is behind a profile, so `docker compose up` never starts it.
  #
  #   docker compose run --rm seed              # upsert the catalog
  #   docker compose run --rm seed --reset      # wipe + reload (after regenerating)
  seed:
    build:
      context: .
      dockerfile: dockerfile
    profiles: ["tools"]
    # entrypoint + `docker compose run seed --reset` appends the extra flag
    entrypoint:
      - python
      - /pipelines/seed.py
      - --seed-file=/data/processed/products.jsonl
    command: []
    environment:
      DATABASE_URL: postgresql://toko:toko@db:5432/toko
    volumes:
      - ../data:/data:ro
      - ../pipelines:/pipelines:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
