[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess with shell=False is fine
    "S607",   # partial executable path is fine
    "S311",   # random is fine for non-crypto
    "S113",   # requests timeout — we handle timeouts explicitly
    "S108",   # /tmp usage — acceptable in containers
    "S608",   # SQL f-strings — all use parameterized values; f-strings are for table/column names only
    "S310",   # urllib.request.urlopen — needed for HTTP calls with custom options
    "S110",   # try-except-pass — used for optional imports
    "S112",   # try-except-continue — used for optional imports
    "E501",   # line length handled by formatter
    "E402",   # module-level import not at top — needed for sys.path hacks in tests
]

[tool.ruff.lint.per-file-ignores]
"api/tests/*" = ["S101", "S106"]
"pipelines/tests/*" = ["S101"]
"pipelines/*.py" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipelines/tests"]
markers = [
    "llm: tests that require a real LLM key (OpenRouter or Gemini)",
]
